services:
  postgres:
    image: postgres:15-alpine
    container_name: bankbot-database
    ports:
      - "5432:5432"
    volumes:
      - bankbot-pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bankbot
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "bankbot"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  bankbot-pgdata: